# Le veilleur de la passerelle d'échange.
#
# Il valide ce que les partenaires déposent dans `entrant/` et rafraîchit ce
# qu'ils lisent dans `sortant/`. Un dépôt attend donc au plus un passage avant
# d'avoir son verdict — et ce verdict est un fichier lisible dans `rejets/`,
# pas un message à demander.
#
# Ici plutôt que sur le serveur, pour la même raison que la synchronisation des
# AVP : rien à maintenir, et chaque exécution est visible par toute l'équipe.

name: Passerelle d'échange

on:
  schedule:
    # Toutes les quinze minutes. GitHub décale les déclenchements chargés : ne
    # pas promettre aux partenaires une minute précise, mais « un quart d'heure ».
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: passerelle
  cancel-in-progress: false

jobs:
  veiller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Appeler le veilleur
        env:
          JETON: ${{ secrets.AVP_SYNC_TOKEN }}
          API: https://zako.nc/avp/app/api/index.php
        run: |
          if [ -z "$JETON" ]; then
            echo "::error::Le secret AVP_SYNC_TOKEN n'est pas défini."
            exit 1
          fi
          reponse=$(curl -sS --max-time 300 -X POST "$API?r=admin/passerelle" \
            -H "X-Sync-Token: $JETON" \
            -H 'Content-Type: application/json' \
            -d '{}' \
            -w '\n%{http_code}')
          code=$(printf '%s' "$reponse" | tail -n 1)
          corps=$(printf '%s' "$reponse" | sed '$d')
          echo "$corps"
          if [ "$code" != "200" ]; then
            echo "::error::La passerelle a répondu $code"
            exit 1
          fi
          echo "$corps" >> "$GITHUB_STEP_SUMMARY"
