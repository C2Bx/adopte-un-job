name: Vérification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: beta/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run test:php
      - run: php -l public/relais.php && php -l public/matching-securite.php
      - run: npm run build
      - run: npm audit --audit-level=high
